name: BreezeBio (formerly GenEdit)
description: >-
  BreezeBio, Inc. (formerly GenEdit) is a clinical-stage genetic medicines company based in South
  San Francisco, California, solving the central delivery problem of gene editing and genetic
  medicine. Its proprietary NanoGalaxy platform is a library of thousands of non-viral, non-lipid
  polymer nanoparticles engineered to deliver genetic payloads (mRNA, DNA, and CRISPR
  ribonucleoprotein) to specific cell types and tissues without triggering an immune response.
  The company is advancing an internal pipeline of precision genetic medicines focused on
  autoimmune disease and oncology, led by BRZ-101, a tolerance-inducing candidate for Type 1
  diabetes. GenEdit rebranded to BreezeBio in February 2026 alongside a $60M Series B, and has
  established platform partnerships with Roche's Genentech and Sarepta Therapeutics. This is a
  therapeutics company with no public developer API, SDK, or developer portal; the profile
  captures its identity and domain-security posture.
